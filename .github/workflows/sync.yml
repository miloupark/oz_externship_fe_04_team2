name: Sync develop -> my repo (Vercel deploy)

on:
  push:
    branches: ['develop']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to my repo develop (via Access Token)
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          git remote add myrepo "https://x-access-token:${ACCESS_TOKEN}@github.com/miloupark/oz_externship_fe_04_team2.git"
          git push myrepo develop:develop --force-with-lease
