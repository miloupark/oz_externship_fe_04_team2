name: Synchronize to forked repo

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/OZ-Coding-School/oz_externship_fe_04_team2.git || true
          git fetch upstream develop
          git checkout develop
          git merge --no-edit upstream/develop

      - name: Push to fork (this repo)
        env:
          TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ACCESS_TOKEN is missing"
            exit 1
          fi

          git push --force-with-lease \
            "https://x-access-token:${TOKEN}@github.com/miloupark/oz_externship_fe_04_team2.git" \
            develop:develop
